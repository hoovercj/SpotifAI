# Run when commits are pushed to main
on:
  workflow_dispatch:
  push:
    # Run when commits are pushed to mainline branch (main or master)
    # Set this to the mainline branch you are using
    branches:
      - main

# Set up permissions for deploying with secretless Azure federated credentials
# https://learn.microsoft.com/en-us/azure/developer/github/connect-from-azure?tabs=azure-portal%2Clinux#set-up-azure-login-with-openid-connect-authentication
permissions:
  id-token: write
  contents: read


jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install azd
        uses: Azure/setup-azd@v2
      - name: Log in with Azure (Federated Credentials)
        run: |
          azd auth login `
            --client-id "$Env:AZURE_CLIENT_ID" `
            --federated-credential-provider "github" `
            --tenant-id "$Env:AZURE_TENANT_ID"
        shell: pwsh


      - name: Provision Infrastructure
        run: azd provision --no-prompt
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REDIRECT_URI: ${{ vars.SPOTIFY_REDIRECT_URI }}
          OPEN_WEATHER_API_KEY: ${{ secrets.OPEN_WEATHER_API_KEY }}
          LOCATION_IQ_API_KEY: ${{ secrets.LOCATION_IQ_API_KEY }}
          REJSEPLANEN_ACCESS_ID: ${{ secrets.REJSEPLANEN_ACCESS_ID }}
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}

      # Build a slim, self-contained artifact in ./release. azd's `dist:
      # release` in azure.yaml makes it zip *only* this folder and ship it
      # straight to /home/site/wwwroot (no Oryx, no server-side npm install).
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Build artifact
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build           # vite -> dist/
          rm -rf release
          mkdir release
          cp -R server public dist release/
          cp package.json package-lock.json release/
          pushd release
          npm ci --omit=dev --no-audit --no-fund
          popd
          echo "=== release/ tree (top level) ==="
          ls -la release
          echo "=== release/dist ==="
          ls release/dist | head
          echo "=== release/node_modules (sanity) ==="
          ls release/node_modules | head

      - name: Deploy Application
        run: azd deploy --no-prompt
        env:
          AZD_DEPLOY_TIMEOUT: '2400'
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REDIRECT_URI: ${{ vars.SPOTIFY_REDIRECT_URI }}
          OPEN_WEATHER_API_KEY: ${{ secrets.OPEN_WEATHER_API_KEY }}
          LOCATION_IQ_API_KEY: ${{ secrets.LOCATION_IQ_API_KEY }}
          REJSEPLANEN_ACCESS_ID: ${{ secrets.REJSEPLANEN_ACCESS_ID }}
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
        
