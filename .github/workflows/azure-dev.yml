# Run when commits are pushed to main
on:
  workflow_dispatch:
  push:
    # Run when commits are pushed to mainline branch (main or master)
    # Set this to the mainline branch you are using
    branches:
      - main

# Set up permissions for deploying with secretless Azure federated credentials
# https://learn.microsoft.com/en-us/azure/developer/github/connect-from-azure?tabs=azure-portal%2Clinux#set-up-azure-login-with-openid-connect-authentication
permissions:
  id-token: write
  contents: read


jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install azd
        uses: Azure/setup-azd@v2
      - name: Log in with Azure (Federated Credentials)
        run: |
          azd auth login `
            --client-id "$Env:AZURE_CLIENT_ID" `
            --federated-credential-provider "github" `
            --tenant-id "$Env:AZURE_TENANT_ID"
        shell: pwsh


      - name: Provision Infrastructure
        run: azd provision --no-prompt
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REDIRECT_URI: ${{ vars.SPOTIFY_REDIRECT_URI }}
          OPEN_WEATHER_API_KEY: ${{ secrets.OPEN_WEATHER_API_KEY }}
          LOCATION_IQ_API_KEY: ${{ secrets.LOCATION_IQ_API_KEY }}
          REJSEPLANEN_ACCESS_ID: ${{ secrets.REJSEPLANEN_ACCESS_ID }}
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}

      # Build a slim, self-contained artifact in ./release, then zip it. We
      # ship release.zip directly via `az webapp deploy` (below) instead of
      # `azd deploy`, because azd's js packager strips `node_modules/` even
      # when `dist:` points at a pre-built tree — so the container starts
      # with no dependencies and crashes with "Cannot find module 'dotenv'".
      # Going through az CLI side-steps that entirely: the zip is shipped to
      # /home/site/wwwroot verbatim, with Oryx disabled via app settings.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Build artifact
        shell: bash
        env:
          # Vite bakes these into the client bundle at build time (see
          # vite.config.mjs CLIENT_ENV_KEYS). They MUST be set here, not just
          # on the App Service runtime — the running server env is invisible
          # to the already-built bundle the browser downloads.
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_REDIRECT_URI: ${{ vars.SPOTIFY_REDIRECT_URI }}
        run: |
          set -euo pipefail
          # Pull the App Insights connection string from azd env (populated by
          # the appInsights.bicep module on `azd provision`). Vite will see it
          # via `process.env.VITE_APPINSIGHTS_CONNECTION_STRING` and bake it
          # into client/lib/telemetry.js. Without this export the client
          # bundle ships with an empty string and client-side telemetry
          # silently no-ops in prod.
          export VITE_APPINSIGHTS_CONNECTION_STRING="$(azd env get-value VITE_APPINSIGHTS_CONNECTION_STRING)"
          npm ci
          npm run build           # vite -> dist/
          rm -rf release release.zip
          mkdir release
          # personas/ + prompts/ are read at request time by the API
          # (loadPersonas, loadPrompt) via `path.resolve(__dirname, '../../..', X)`,
          # so they must sit next to server/ in the deployed tree.
          cp -R server public dist personas prompts release/
          cp package.json package-lock.json release/
          pushd release
          npm ci --omit=dev --no-audit --no-fund
          popd
          echo "=== release/ tree (top level) ==="
          ls -la release
          echo "=== release/node_modules (sanity) ==="
          ls release/node_modules | head
          (cd release && zip -qr ../release.zip .)
          ls -lh release.zip

      - name: Log in to Azure CLI (Federated Credentials)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # azure/webapps-deploy needs the App Service name as an input. azd writes
      # bicep outputs (including WEB_NAME) to the env after `azd provision`, so
      # we surface it as a step output the deploy action can reference.
      - name: Resolve deploy target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          echo "name=$(azd env get-value WEB_NAME)" >> "$GITHUB_OUTPUT"

      - name: Deploy Application
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.target.outputs.name }}
          package: release.zip
          type: zip

